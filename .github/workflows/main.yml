name: Build APK

on:
  push:
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL du backend, ex. https://comparateur-api.onrender.com"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser le projet
        run: unzip -q comparateur-android.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Rendre gradlew exécutable dynamiquement
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f)
          echo "Fichier gradlew trouvé à : $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"

      - name: Compiler l'APK
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Dossier du projet : $PROJECT_DIR"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon ${API_URL:+-PapiUrl="$API_URL"}

      - uses: actions/upload-artifact@v4
        with:
          name: comparateur-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
