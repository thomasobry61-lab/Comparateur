name: Build APK

on:
  push:
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL du backend, ex. https://comparateur-api.onrender.com"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lister les fichiers du dépôt (Debug)
        run: ls -la

      - name: Décompresser le projet
        run: unzip -q comparateur-android.zip

      - name: Lister le contenu après décompression (Debug)
        run: ls -R

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK intelligemment
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon ${API_URL:+-PapiUrl="$API_URL"}
          elif [ -f "comparateur-android/gradlew" ]; then
            chmod +x comparateur-android/gradlew
            cd comparateur-android
            ./gradlew assembleDebug --no-daemon ${API_URL:+-PapiUrl="$API_URL"}
          else
            echo "Aucun gradlew trouvé, utilisation de gradle global..."
            gradle assembleDebug --no-daemon ${API_URL:+-PapiUrl="$API_URL"}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: comparateur-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          
