name: Build APK

on:
  push:
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL du backend, ex. https://comparateur-api.onrender.com"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser le projet
        run: unzip -q comparateur-android.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK depuis le bon dossier
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          # Chercher automatiquement le dossier contenant le projet Android
          SETTINGS_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Erreur : Aucun fichier settings.gradle trouvé dans le ZIP !"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Projet Android détecté dans le dossier : $PROJECT_DIR"
          
          # Se placer dans le dossier du projet
          cd "$PROJECT_DIR"
          
          # Lancer la compilation avec gradlew ou gradle
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon ${API_URL:+-PapiUrl="$API_URL"}
          else
            gradle assembleDebug --no-daemon ${API_URL:+-PapiUrl="$API_URL"}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: comparateur-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          
