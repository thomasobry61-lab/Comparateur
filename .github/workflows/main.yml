name: Build APK

on:
  push:
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL du backend, ex. https://comparateur-api.onrender.com"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser le projet
        run: unzip -q comparateur-android.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Rendre gradlew exécutable
        run: chmod +x comparateur-android/gradlew

      - name: Compiler l'APK
        working-directory: comparateur-android
        env:
          API_URL: ${{ inputs.api_url }}
        run: ./gradlew assembleDebug --no-daemon ${API_URL:+-PapiUrl="$API_URL"}

      - uses: actions/upload-artifact@v4
        with:
          name: comparateur-apk
          path: comparateur-android/app/build/outputs/apk/debug/app-debug.apk
